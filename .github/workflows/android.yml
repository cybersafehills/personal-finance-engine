name: Android Companion

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric fetches its ~100 MB android-all framework jar at test time
      # via its own MavenArtifactFetcher (not Gradle), which flakes on CI
      # network hiccups. Cache it across runs so a transient failure can't
      # recur once it's warm.
      - name: Cache Robolectric framework jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ runner.os }}-v1

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Unit tests (pure logic — matchers, normalize, health, queue)
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # Verifies R8 / resource shrinking and the ProGuard rules on every change.
      # Unsigned here (no keystore secrets on PRs) — the `distribute` job builds
      # the signed one.
      - name: Assemble release APK (R8 verification, unsigned)
        run: ./gradlew :app:assembleRelease

      # The installable debug build. Download from the run's "Artifacts"
      # section, transfer to an Android phone (AirDrop / Drive / adb), and
      # install it — no local Android SDK needed. Unsigned-debug: fine for
      # sideloading, not for the Play Store.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
          if-no-files-found: ignore

  # Signed release APK → Firebase App Distribution.
  # Opt-in: set repo variable ANDROID_DISTRIBUTE=true and the secrets below
  # (see docs/android-companion-release.md). Skipped entirely otherwise.
  distribute:
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ANDROID_DISTRIBUTE == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Write Firebase service-account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Build + upload to Firebase App Distribution
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          printf '%s\n' "$COMMIT_MSG" > "$RUNNER_TEMP/release-notes.txt"
          # Pass appId + credentials as explicit task flags — the Firebase App
          # Distribution plugin does not reliably read the FIREBASE_APP_ID /
          # GOOGLE_APPLICATION_CREDENTIALS env vars when there is no
          # google-services.json ("> Missing app id").
          ./gradlew :app:assembleRelease :app:appDistributionUploadRelease \
            --appId="$FIREBASE_APP_ID" \
            --serviceCredentialsFile="$GOOGLE_APPLICATION_CREDENTIALS" \
            --artifactPath=app/build/outputs/apk/release/app-release.apk \
            --releaseNotesFile="$RUNNER_TEMP/release-notes.txt"
