name: CI

# Phase 4.0 quality gate, extended by the application-shell/navigation/
# dashboard-privacy task with an e2e-tests job. This workflow remains
# non-deploying and never targets the linked production project
# (zttxsaiywkfrbdxgzbjd) in any way. deno-quality and migration-tests never
# install the Supabase CLI or configure a Supabase access token/service-role
# key/DATABASE_URL at all; migration-tests talks only to a disposable
# postgres:17 service container created and destroyed by this workflow run,
# and supabase/migrations/tests/run_migration_tests.sh additionally refuses
# to run at all (assert_not_production_target) if any Supabase/production-
# shaped credential or hostname is present in its environment, regardless
# of what this file does or doesn't set.
#
# e2e-tests is the one job that DOES install the Supabase CLI and run
# `supabase start` - but only to boot a fully local, throwaway stack (no
# production credential of any kind is ever configured), and
# e2e/production-guard.ts independently refuses to run if the resolved
# Supabase URL looks production-shaped, the same defense-in-depth pattern
# migration-tests already uses. It's also the one job that uploads
# artifacts (Playwright's HTML report, traces, and screenshots), and only
# when a run actually fails - a deliberate, scoped exception to the
# otherwise-artifact-free philosophy below, kept because e2e failures are
# close to undebuggable without them.

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: every job here only reads the repository. None comments
# on PRs, touches packages, or deploys anything. This is the floor every
# job gets; e2e-tests alone grants itself one additional job-level scope
# (actions: write, for artifact upload) rather than raising it here for
# every job.
permissions:
  contents: read

jobs:
  deno-quality:
    name: Deno fmt / lint / check / test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.5"

      - name: deno fmt --check
        run: deno fmt --check supabase/functions supabase/migrations/tests

      - name: deno lint
        run: deno lint supabase/functions

      - name: deno check (ingest-momo entry point)
        run: deno check supabase/functions/ingest-momo/index.ts

      - name: deno check (_shared entry points)
        run: |
          set -euo pipefail
          for f in accounting kigali-time money reconciliation types; do
            deno check "supabase/functions/_shared/$f.ts"
          done

      - name: deno test (ingest-momo)
        run: deno test supabase/functions/ingest-momo/tests

      - name: deno test (_shared)
        run: deno test supabase/functions/_shared/tests

      # web/lib's pure/deno-testable modules (budget-math.ts, money.ts,
      # report-math.ts, report-period.ts, report-alert-messages.ts,
      # report-types.ts, transfer-detection.ts) and their *_test.ts files -
      # previously untested in CI (only supabase/functions ran here).
      # Deliberately not also running `deno fmt --check`/`deno lint`
      # against web/lib: those files follow this project's normal
      # TypeScript/ESLint conventions (checked separately, outside this
      # workflow, by the Next.js toolchain), not this repo's Deno-specific
      # formatting/lint rules - only `deno test`'s type-check + assertions
      # apply here.
      - name: deno test (web/lib)
        run: deno test web/lib

  migration-tests:
    name: Migration chain tests (disposable PostgreSQL 17)
    runs-on: ubuntu-24.04

    # Ephemeral, workflow-run-scoped PostgreSQL 17 server - torn down
    # automatically when the job ends. Never reachable outside this job, no
    # persistent volume, no relation whatsoever to the linked Supabase
    # production project. Version pinned to 17 to match production
    # (see supabase/config.toml major_version / `supabase projects list`).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # pg_dump cannot dump from a server newer than its own major version,
      # so the client tools here must be version 17 to match the service
      # container above - the runner image's default apt package is an
      # older major version. This adds the official PGDG apt repository
      # (apt.postgresql.org) purely to install matching client binaries; it
      # has no relation to the Supabase-linked production project.
      - name: Install PostgreSQL 17 client tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg-archive-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      # PFE_PG_MODE=external targets the already-running service container
      # above instead of spawning/tearing down its own initdb/pg_ctl
      # cluster (the default "spawn" mode used locally) - see the mode
      # documentation at the top of run_migration_tests.sh. This exercises
      # the exact same 21 test assertions (H, F, G, A-E, I, and the
      # privilege/RLS regression checks) as local "spawn" mode; only the
      # setup/teardown mechanics differ between modes. No Supabase secret
      # of any kind is set in this job, and PGHOST/PGPORT/PGUSER below
      # point only at the disposable service container declared in this
      # same job - assert_not_production_target() in the script itself
      # independently refuses to run against anything that looks
      # otherwise, regardless of what this step sets.
      - name: Run migration chain tests against ephemeral PostgreSQL
        env:
          PFE_PG_MODE: external
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: supabase/migrations/tests/run_migration_tests.sh

  e2e-tests:
    name: e2e / accessibility (Playwright, disposable local Supabase)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # upload-artifact needs this to attach the HTML report/traces to the
      # run - see the workflow-level comment above. Nothing else in this
      # job needs any elevated scope.
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers (chromium only - this job only runs the chromium-desktop project)
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Boots a fully local, disposable stack (Postgres + GoTrue + PostgREST
      # + Storage, all in throwaway Docker containers this step starts and
      # this runner destroys with it) - never any credential or hostname
      # belonging to the linked production project. e2e/production-
      # guard.ts independently refuses to run otherwise regardless of what
      # this step does.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: "2.115.0"

      - name: supabase start (disposable local stack)
        run: supabase start

      # The Next.js app itself (not just e2e/auth.setup.ts) needs these to
      # build/run at all - lib/supabase-server.ts and lib/site-url.ts throw
      # at import time otherwise. Every value here points at the
      # disposable local stack just started above; nothing here is a
      # secret (these are well-known, fixed local-dev defaults baked into
      # the Supabase CLI itself, never the linked production project's
      # credentials).
      - name: Export local Supabase connection details for the app build
        run: |
          set -euo pipefail
          STATUS_JSON="$(supabase status --output json)"
          {
            echo "SUPABASE_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY')"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY')"
            echo "SITE_URL=http://127.0.0.1:3417"
          } >> "$GITHUB_ENV"

      # e2e/auth.setup.ts separately resolves these same values itself
      # (see e2e/README.md) for the test user it creates - this step only
      # covers the app server Playwright's webServer builds/starts.
      - name: Run e2e/accessibility/visual-regression suite (chromium-desktop + unauthenticated)
        working-directory: web
        run: npx playwright test --project=unauthenticated --project=chromium-desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: supabase stop
        if: always()
        run: supabase stop --no-backup
