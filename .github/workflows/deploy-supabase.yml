name: Deploy Supabase

# Deploys database migrations and Edge Functions to the linked production
# project after (and only after) the "CI" workflow has passed on main -
# this is the automation that was missing when the ingest-momo function
# drifted for hours behind committed code (production was still running
# pre-categorization-engine code while migrations, and later commits,
# moved on without it - see the 2026-08-25 incident this workflow exists
# to prevent from happening silently again).
#
# Deliberately a SEPARATE workflow from ci.yml, not a job added to it:
# ci.yml documents itself as read-only and non-deploying, and holds no
# Supabase credentials. This file is the only place in the repo that
# does, scoped to the single job below.
#
# Required repository secrets (Settings -> Secrets and variables ->
# Actions), neither of which this workflow - or anyone who wrote it -
# should ever be handed as plain text outside GitHub's own secret store:
#   SUPABASE_ACCESS_TOKEN  - a Supabase personal/CI access token
#                            (https://supabase.com/dashboard/account/tokens),
#                            scoped to this project if possible. Used for
#                            `supabase link` and `functions deploy`.
#   SUPABASE_DB_PASSWORD   - the linked project's database password
#                            (Project Settings -> Database), used for
#                            `db push` to actually apply migrations.
# Project ref (zttxsaiywkfrbdxgzbjd) is not a secret - it's a public
# identifier, already visible in this repo's history and CLI output.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual fallback - e.g. to redeploy after adding the secrets for the
  # first time, or to re-run a deploy without needing a new commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Push migrations and deploy Edge Functions
    runs-on: ubuntu-24.04
    # Only proceed if the CI run this was triggered by actually succeeded
    # (workflow_dispatch has no workflow_run event, so it always proceeds).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Checkout the exact commit CI validated
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Pinned, not "latest" - this is the exact CLI version this
          # workflow's commands (link/db push/functions deploy) were
          # actually verified against when this file was written.
          # "latest" would let a future CLI major version change command
          # behavior under this workflow with no warning.
          version: "2.115.0"

      - name: Link to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Also needed here, not just for db push below - without it,
          # `link` prompts interactively for the DB password, which would
          # just hang forever in a non-interactive CI shell.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref zttxsaiywkfrbdxgzbjd

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy
