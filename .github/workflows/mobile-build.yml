name: Mobile cloud build

# Builds the OneLedger mobile app on Expo's servers (EAS Build) so no
# developer laptop needs an Android SDK or Xcode. MANUAL ONLY: each run
# uses EAS build minutes, so it never triggers on push or pull_request.
#
# One-time setup (docs/mobile-release.md):
#   - repo secret EXPO_TOKEN: an Expo access token for the account that
#     owns the project (expo.dev -> Account settings -> Access tokens).
#   - EAS environment variables (oneledger-mobile/scripts/set-eas-env.sh).
#   - iOS builds additionally need the Apple Developer Program membership.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options: [android, ios]
        default: android
      profile:
        description: "preview = installable test build; production = store build"
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: oneledger-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: oneledger-mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      # --no-wait queues the build on Expo and returns, so this job does not
      # burn runner minutes while the build runs. Progress and the download
      # link are on the build page printed below.
      - name: Queue the build
        run: >
          eas build
          --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }}
          --non-interactive
          --no-wait
